[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "search-fallback-chain"
version = "0.1.0"
description = "Resilience pattern for web searches: browser, human-solved CAPTCHA, real browser, quota-guarded paid API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
